projects:
  - title: "Recursive Episodic Memory (REM) RAG"
    subtitle: "Engineered a memory compression framework for long-context LLM agents. Utilizing FAISS-based dense retrieval, hierarchical semantic indexing, and adaptive replay mechanisms, this architecture mitigates context decay and enables persistent, multi-session agentic reasoning across complex computational pipelines."
    thumbnail: "assets/posts/kube-article.webp"
    url: "https://github.com/thisishardik/REM-RAG"
    selected: y

  - title: "PokerFace: RL for Strategic Deception in LLMs"
    subtitle: "Trained LLMs for strategic deception and negotiation in a Market for Lemons env using PPO. Engineered a two-stage reasoning pipeline to maximize strategic rewards without leaking hidden states to opponents. Scaled training via QLoRA for parameter-efficient fine-tuning on instruct models."
    thumbnail: "assets/posts/kube-article.webp"
    url: "https://github.com/thisishardik/Project-PokerFace"
    selected: y

  - title: "Ad-Astra: Agentic Ad Intelligence Engine"
    subtitle: "Built a dynamic ad generation and placement engine for X (Twitter), using Grok 4.1 Reasoning models. Utilized behavioral scroll telemetry and temporal interaction signals to optimize in-feed ad placement improving relevance and engagement."
    thumbnail: "assets/posts/kube-article.webp"
    url: "https://github.com/thisishardik/xai-ad-intelligence-engine"
    selected: y

  - title: "KeyCognition: Predicting Cognitive Load via Keystrokes"
    subtitle: "Behavioral AI platform that predicts user cognitive load in real-time using temporal sequence modeling. Engineered a React app to extract micro-temporal typing anomalies like dwell time & flight time using 136M keystrokes."
    thumbnail: "assets/posts/kube-article.webp"
    url: "https://github.com/xsuryanshx/KeyCognition"
    selected: y
    
  - title: "Auto-Explainability & Evaluation of LLMs"
    subtitle: "Transformer explainability framework designed to demystify language model generation. Utilizes Integrated Gradients to map and visualize token-level prediction attributions enabling deep interpretability."
    thumbnail: "assets/posts/kube-article.webp"
    url: "https://github.com/thisishardik/explain-llms/tree/main"
    selected: y

  - title: "No-Code Algo-Trading Portfolio Manager"
    subtitle: "Domain-Specific Language (DSL) framework powering a no-code trading platform. Leverages hybrid recommendation models to dynamically compile drag-and-drop user inputs into optimized algorithms, thereby minimizing risk and expected shortfall."
    thumbnail: "assets/posts/kube-article.webp"
